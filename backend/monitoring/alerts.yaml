apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-alerts
  namespace: vault-0711
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: vault-api
    rules:
    # High Error Rate
    - alert: VaultAPIHighErrorRate
      expr: |
        sum(rate(http_requests_total{namespace="vault-0711",status=~"5.."}[5m])) /
        sum(rate(http_requests_total{namespace="vault-0711"}[5m])) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High API error rate"
        description: "API error rate is {{ $value | humanizePercentage }} (>5%)"
    
    # High Latency
    - alert: VaultAPIHighLatency
      expr: |
        histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="vault-0711"}[5m])) by (le)) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High API latency"
        description: "P95 latency is {{ $value }}s (>2s)"
    
    # API Down
    - alert: VaultAPIDown
      expr: up{job="vault-api"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Vault API is down"
        description: "Vault API has been down for more than 1 minute"

  - name: vault-database
    rules:
    # PostgreSQL Down
    - alert: PostgreSQLDown
      expr: pg_up{namespace="vault-0711"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL is down"
        description: "PostgreSQL database is not responding"
    
    # High Connection Count
    - alert: PostgreSQLHighConnections
      expr: |
        pg_stat_activity_count{datname="vault"} > 
        pg_settings_max_connections{} * 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL connection count high"
        description: "Connection count is {{ $value }} (>80% of max)"
    
    # Slow Queries
    - alert: PostgreSQLSlowQueries
      expr: |
        rate(pg_stat_statements_seconds_total{datname="vault"}[5m]) > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL slow queries detected"
        description: "Average query time is {{ $value }}s"

  - name: vault-storage
    rules:
    # MinIO Down
    - alert: MinIODown
      expr: minio_cluster_health_status == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MinIO storage is down"
        description: "MinIO cluster is not healthy"
    
    # Storage Almost Full
    - alert: MinIOStorageAlmostFull
      expr: |
        (minio_bucket_usage_total_bytes{bucket="vault"} / 
        minio_bucket_quota_total_bytes{bucket="vault"}) > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Vault storage almost full"
        description: "Storage is {{ $value | humanizePercentage }} full"
    
    # Storage Critical
    - alert: MinIOStorageCritical
      expr: |
        (minio_bucket_usage_total_bytes{bucket="vault"} / 
        minio_bucket_quota_total_bytes{bucket="vault"}) > 0.95
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Vault storage critical"
        description: "Storage is {{ $value | humanizePercentage }} full - immediate action required"

  - name: vault-redis
    rules:
    # Redis Down
    - alert: RedisDown
      expr: redis_up{namespace="vault-0711"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis is down"
        description: "Redis cache is not responding"
    
    # High Memory Usage
    - alert: RedisHighMemory
      expr: |
        redis_memory_used_bytes{namespace="vault-0711"} / 
        redis_memory_max_bytes{namespace="vault-0711"} > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis memory high"
        description: "Redis memory usage is {{ $value | humanizePercentage }}"

  - name: vault-ai
    rules:
    # Ollama Down
    - alert: OllamaDown
      expr: up{job="ollama"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Ollama LLM service is down"
        description: "AI features will be degraded"
    
    # High Inference Latency
    - alert: OllamaHighLatency
      expr: |
        histogram_quantile(0.95, sum(rate(ollama_inference_duration_seconds_bucket[5m])) by (le)) > 30
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Ollama inference slow"
        description: "P95 inference time is {{ $value }}s"

  - name: vault-pods
    rules:
    # Pod Restarts
    - alert: PodRestartingFrequently
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="vault-0711"}[1h]) > 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod restarting frequently"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"
    
    # Pod Not Ready
    - alert: PodNotReady
      expr: |
        kube_pod_status_ready{namespace="vault-0711",condition="true"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod not ready"
        description: "Pod {{ $labels.pod }} has been not ready for 5 minutes"
    
    # High CPU
    - alert: PodHighCPU
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="vault-0711"}[5m])) by (pod) /
        sum(kube_pod_container_resource_limits{namespace="vault-0711",resource="cpu"}) by (pod) > 0.9
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod high CPU usage"
        description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }}"
