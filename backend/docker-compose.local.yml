# 0711-Vault Local Development Stack
# Usage: docker compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vault-postgres
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      - "5432:5432"
    volumes:
      - vault-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vault-redis
    ports:
      - "6379:6379"
    volumes:
      - vault-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: vault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vault-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: vault-neo4j
    environment:
      NEO4J_AUTH: neo4j/vault0711
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - vault-neo4j-data:/data
    restart: unless-stopped

  vault-api:
    build: ./services/vault-api
    container_name: vault-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vault:vault@postgres:5432/vault
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: vault0711
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: storage.0711.io
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vault
      MINIO_SECURE: "true"
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBEDDING_MODEL: bge-m3:latest
      VISION_MODEL: llama4:latest
      JWT_SECRET: dev_secret_key_change_in_production_0711vault
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:5173"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service:
    build: ./services/ai-service
    container_name: vault-ai
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://vault:vault@postgres:5432/vault
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBEDDING_MODEL: bge-m3:latest
      VISION_MODEL: llama4:latest
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault-postgres-data:
  vault-redis-data:
  vault-minio-data:
  vault-neo4j-data:
