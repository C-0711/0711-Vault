# Vault services - unique names & ports
# Uses existing Ollama on host (port 11434)

services:
  # Disable problematic services
  traefik:
    profiles: ["disabled"]
  
  ollama:
    profiles: ["disabled"]
  
  ollama-init:
    profiles: ["disabled"]
  
  minio-init:
    profiles: ["disabled"]

  postgres:
    container_name: vault-postgres
    ports:
      - "9500:5432"

  redis:
    container_name: vault-redis
    ports:
      - "9501:6379"

  neo4j:
    container_name: vault-neo4j
    ports:
      - "9502:7474"
      - "9503:7687"

  minio:
    container_name: vault-minio
    ports:
      - "9504:9000"
      - "9505:9001"

  vault-api:
    container_name: vault-api
    ports:
      - "9506:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    container_name: vault-ai-service
    ports:
      - "9507:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: vault-frontend
    ports:
      - "9508:80"
