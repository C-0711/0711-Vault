version: '3.8'

# All services separate for Vault - unique names & ports

services:
  postgres:
    container_name: vault-postgres
    ports:
      - "5440:5432"

  redis:
    container_name: vault-redis
    ports:
      - "6380:6379"

  neo4j:
    container_name: vault-neo4j
    ports:
      - "7476:7474"
      - "7689:7687"

  ollama:
    container_name: vault-ollama
    ports:
      - "11435:11434"

  minio:
    container_name: vault-minio
    ports:
      - "4052:9000"
      - "4053:9001"

  traefik:
    container_name: vault-traefik
    ports:
      - "81:80"
      - "444:443"
      - "8081:8080"

  vault-api:
    container_name: vault-api
    ports:
      - "8000:8000"

  ai-service:
    container_name: vault-ai-service
    ports:
      - "8003:8000"

  frontend:
    container_name: vault-frontend
    ports:
      - "3000:80"
