# Vault services - unique names & ports
# Uses existing Ollama on host (port 11434)

services:
  # Disable problematic services
  traefik:
    profiles: ["disabled"]
  
  ollama:
    profiles: ["disabled"]
  
  ollama-init:
    profiles: ["disabled"]
  
  minio-init:
    profiles: ["disabled"]

  postgres:
    container_name: vault-postgres
    ports:
      - "5440:5432"

  redis:
    container_name: vault-redis
    ports:
      - "6380:6379"

  neo4j:
    container_name: vault-neo4j
    ports:
      - "7476:7474"
      - "7689:7687"

  minio:
    container_name: vault-minio
    ports:
      - "4052:9000"
      - "4053:9001"

  vault-api:
    container_name: vault-api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    container_name: vault-ai-service
    ports:
      - "8003:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    container_name: vault-frontend
    ports:
      - "3000:80"
