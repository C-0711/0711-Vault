services:
  # ===========================================
  # DATABASES
  # ===========================================
  
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 0711-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    # ports: # Override file provides ports (9500+)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 0711-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    # ports: # Override file provides ports (9500+)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: 0711-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-vault0711}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    # ports: # Override file provides ports (9500+)
    restart: unless-stopped

  # ===========================================
  # OBJECT STORAGE
  # ===========================================
  
  minio:
    image: minio/minio
    container_name: 0711-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    # ports: # Override file provides ports (9500+)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Create default bucket
  minio-init:
    image: minio/mc
    container_name: 0711-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing minio/vault;
      mc anonymous set download minio/vault;
      exit 0;
      "

  # ===========================================
  # AI / LLM
  # ===========================================
  
  ollama:
    image: ollama/ollama
    container_name: 0711-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Download required models
  ollama-init:
    image: ollama/ollama
    container_name: 0711-ollama-init
    depends_on:
      - ollama
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      ollama pull bge-m3:latest;
      ollama pull llama4:latest;
      echo 'Models downloaded successfully';
      "

  # ===========================================
  # APPLICATION SERVICES
  # ===========================================
  
  vault-api:
    build: ./services/vault-api
    container_name: 0711-vault-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
      VISION_MODEL: ${VISION_MODEL:-llama4:latest}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    # ports: # Override file provides ports (9500+)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./services/ai-service
    container_name: 0711-ai-service
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
      VISION_MODEL: ${VISION_MODEL:-llama4:latest}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
    # ports: # Override file provides ports (9500+)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # FRONTEND
  # ===========================================
  
  frontend:
    build: ../frontend
    container_name: 0711-frontend
    # ports: # Override file provides ports (9500+)
    depends_on:
      - vault-api
    restart: unless-stopped

  # ===========================================
  # REVERSE PROXY
  # ===========================================
  
  traefik:
    image: traefik:v3.0
    container_name: 0711-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  minio-data:
  ollama-data:
