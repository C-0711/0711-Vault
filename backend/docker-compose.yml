services:
  # ===========================================
  # DATABASES
  # ===========================================
  
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 0711-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    # ports: # Override file provides ports (9500+)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 0711-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    # ports: # Override file provides ports (9500+)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: 0711-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-vault0711}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    # ports: # Override file provides ports (9500+)
    restart: unless-stopped

  # ===========================================
  # OBJECT STORAGE - REMOVED (Albert Storage uses PostgreSQL)
  # MinIO replaced with encrypted PostgreSQL storage (ChaCha20-Poly1305)
  # See: services/vault-api/storage_albert.py
  # ===========================================

  # ===========================================
  # AI / LLM
  # ===========================================
  
  ollama:
    image: ollama/ollama
    container_name: 0711-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Download required models
  ollama-init:
    image: ollama/ollama
    container_name: 0711-ollama-init
    depends_on:
      - ollama
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      ollama pull bge-m3:latest;
      ollama pull llama4:latest;
      echo 'Models downloaded successfully';
      "

  # ===========================================
  # APPLICATION SERVICES
  # ===========================================
  
  vault-api:
    build: ./services/vault-api
    container_name: 0711-vault-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
      VISION_MODEL: ${VISION_MODEL:-llama4:latest}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Albert Storage (replaces MinIO)
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      VAULT_KEY_SALT: ${VAULT_KEY_SALT:-}
    # ports: # Override file provides ports (9500+)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./services/ai-service
    container_name: 0711-ai-service
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
      VISION_MODEL: ${VISION_MODEL:-llama4:latest}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
    # ports: # Override file provides ports (9500+)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Background worker for processing queue
  worker:
    build: ./services/vault-api
    container_name: 0711-worker
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
      AI_SERVICE_URL: http://ai-service:8001
      # Albert Storage (replaces MinIO)
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      VAULT_KEY_SALT: ${VAULT_KEY_SALT:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  # ===========================================
  # FRONTEND
  # ===========================================
  
  frontend:
    build: ../frontend
    container_name: 0711-frontend
    # ports: # Override file provides ports (9500+)
    depends_on:
      - vault-api
    restart: unless-stopped

  # ===========================================
  # REVERSE PROXY
  # ===========================================
  
  traefik:
    image: traefik:v3.0
    container_name: 0711-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  ollama-data:
  # minio-data removed - Albert stores encrypted content in PostgreSQL
