apiVersion: v1
kind: Namespace
metadata:
  name: vault-0711
  labels:
    app.kubernetes.io/name: vault-0711
    app.kubernetes.io/part-of: 0711-platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vault-quota
  namespace: vault-0711
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vault-limits
  namespace: vault-0711
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
