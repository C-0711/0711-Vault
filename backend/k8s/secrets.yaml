# WARNING: Use External Secrets Operator or Sealed Secrets in production!
# This is a template - DO NOT commit real secrets to git
apiVersion: v1
kind: Secret
metadata:
  name: vault-secrets
  namespace: vault-0711
type: Opaque
stringData:
  # Database
  POSTGRES_USER: "vault"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"  # Replace with actual secret
  POSTGRES_DB: "vault"
  DATABASE_URL: "postgresql://vault:${POSTGRES_PASSWORD}@postgres:5432/vault"
  
  # Neo4j
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
  NEO4J_URI: "bolt://neo4j:7687"
  
  # Redis
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  
  # MinIO
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
  MINIO_ENDPOINT: "minio:9000"
  
  # JWT
  JWT_SECRET: "${JWT_SECRET}"
  
  # Keycloak
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
---
# For External Secrets Operator (recommended for production)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-external-secrets
  namespace: vault-0711
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: vault-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: vault/postgres
      property: password
  - secretKey: NEO4J_PASSWORD
    remoteRef:
      key: vault/neo4j
      property: password
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: vault/redis
      property: password
  - secretKey: MINIO_ACCESS_KEY
    remoteRef:
      key: vault/minio
      property: access_key
  - secretKey: MINIO_SECRET_KEY
    remoteRef:
      key: vault/minio
      property: secret_key
  - secretKey: JWT_SECRET
    remoteRef:
      key: vault/jwt
      property: secret
